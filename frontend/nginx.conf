server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Docker's embedded DNS, re-queried every 10s. Resolving the backend
        # at request time (via a variable) instead of at config-load time is
        # what keeps this container booting cleanly: with a literal hostname
        # in proxy_pass, nginx resolves `backend` while parsing its config
        # and exits with "host not found in upstream" if the backend isn't
        # up yet -- and once resolved it pins that IP forever, so a backend
        # rebuild leaves nginx proxying to a dead address until it's
        # restarted too. Both failure modes go away here.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $pcc_backend http://backend:4000;
        # No URI part on a variable proxy_pass, so nginx forwards the request
        # URI unchanged: /api/foo -> backend /api/foo. Same paths the literal
        # `proxy_pass http://backend:4000/api/;` produced under `location
        # /api/`, where the prefix was rewritten to itself.
        proxy_pass $pcc_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        # The backend is down or restarting -- answer with a plain 502 rather
        # than nginx's stock error page, so a failed API call is obvious in
        # the browser's network tab instead of looking like an app bug.
        proxy_intercept_errors off;
    }

    location / {
        # frontend/public is bind-mounted over this root (see
        # docker-compose.yml), so files change under a running container.
        # no-cache doesn't disable caching -- it makes the browser
        # revalidate every time, so an edited styles.css/app.js shows up on
        # refresh instead of being served from memory cache. Cheap: nginx
        # answers an unchanged file with a 304.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
