services:
  couchbase:
    # Enterprise Edition 8.0.2 (current as of 2026-08), run under Couchbase's
    # developer/free license: no key, sign-up, or EULA flag needed to start
    # this container — it's free to run for development and testing. A paid
    # subscription is required only for production use — see
    # https://www.couchbase.com/pricing. Unlocks XDCR, the Eventing/
    # Analytics services, and higher per-node concurrency vs. Community
    # Edition; this app only uses the KV/N1QL/Index services either way,
    # so functionally nothing else in the stack changes.
    image: couchbase:enterprise-8.0.2
    container_name: couchbase-pcc-couchbase
    restart: unless-stopped
    ports:
      # Host-side ports only -- remapped from Couchbase's usual 8091/8093 to
      # 9091/9093 so this stack can run alongside the Couchbase Agent
      # Operations Manager on the same machine: AOM's own docker-compose.yml
      # binds host ports 8091-8096 for its own (separate) Couchbase cluster,
      # and two containers can't bind the same host port at once. Only the
      # host-facing side changes -- the container's internal port is still
      # 8091/8093, and backend<->couchbase traffic below (COUCHBASE_MGMT_URL
      # etc.) talks to the container on the internal Docker network, so it's
      # unaffected by this remap.
      - "9091:8091" # Couchbase admin UI (Administrator / password123 after first boot)
      - "9093:8093" # N1QL query service
    volumes:
      - couchbase-data:/opt/couchbase/var
    healthcheck:
      # This only proves the node process is answering HTTP -- it responds
      # here whether or not the cluster has actually been initialized yet.
      # The real "is it ready" wait happens in backend/src/db/couchbase.js's
      # initCluster(), which polls until POST /clusterInit has succeeded and
      # the bucket/index exist. This healthcheck just gates `depends_on`
      # below so the backend doesn't even attempt to connect to a container
      # that hasn't started listening yet.
      #
      # start_period + retries widened (was: no start_period, retries: 12 ->
      # a ~120s budget from container start). That was tuned against a
      # single Couchbase Enterprise container starting alone; it's too
      # tight when this stack is run alongside the Couchbase Agent
      # Operations Manager project's own Couchbase Enterprise container on
      # the same machine (confirmed happening in practice -- both compose
      # projects visible running at once in Docker Desktop). Two Erlang-VM
      # Couchbase boots contending for the same CPU/RAM can each take well
      # over 2 minutes to start answering /pools, and Compose's
      # `depends_on: condition: service_healthy` aborts the whole
      # `up --build` the moment `retries` consecutive checks fail --
      # even if Couchbase goes on to finish booting seconds later, compose
      # has already given up and backend/frontend never start (this is
      # exactly what was observed: "Init complete" in the couchbase logs,
      # but `dependency failed to start: container couchbase-pcc-couchbase is
      # unhealthy` and backend/frontend never created). start_period gives
      # early failures (Erlang VM / web server not listening yet at all) a
      # grace window that doesn't count against the retry budget, and the
      # widened retries give a generous ~7 more minutes on top of that for
      # a genuinely slow, contended boot -- with no cost when Couchbase
      # starts quickly, since healthy is reported as soon as /pools
      # responds either way.
      # NOTE (2026-09-05): curl's -f flag turns ANY HTTP status >= 400 into
      # a failed check -- and this Couchbase Server version answers /pools
      # with 401 Unauthorized (WWW-Authenticate: Basic) as soon as the
      # node process is up, auth or no auth, rather than the pre-auth 200
      # this check originally assumed. That 401 IS the "the node is
      # answering HTTP" signal the comment above is after; -f was throwing
      # it away and reporting unhealthy forever regardless of how long
      # start_period/retries gave it. Dropping -f (and -o to discard the
      # body) fixes this: curl now exits 0 for any completed HTTP
      # response -- 200, 401, whatever -- and only fails on a real
      # transport-level problem (connection refused, timeout), which is
      # what this check is actually meant to catch.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8091/pools"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 40

  backend:
    build: ./backend
    container_name: couchbase-pcc-backend
    restart: on-failure:3
    depends_on:
      couchbase:
        condition: service_healthy
    # host.docker.internal resolves to the host machine automatically on
    # Docker Desktop (macOS/Windows); this extra_hosts entry is what makes
    # the same hostname work on Linux Docker Engine too, so
    # COUCHBASE_AOM_URL's default keeps working regardless of platform.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 4000
      COUCHBASE_MGMT_URL: http://couchbase:8091
      COUCHBASE_QUERY_URL: http://couchbase:8093
      COUCHBASE_USERNAME: Administrator
      COUCHBASE_PASSWORD: password123
      COUCHBASE_BUCKET: procurement
      # LLM calls (the Procurement AI copilot's replies, and each agent
      # decision's buyer-facing rationale) are routed through the Couchbase
      # Agent Operations Manager's caching gateway, pinned to Gemini -- see
      # backend/src/services/aomClient.js. The same client also makes real,
      # RBAC-checked discover/invoke calls against AOM's bundled Snowflake
      # sample server (see copilot.js's Compare suppliers / PO readiness
      # quick actions). The app works fully without this: with no AOM
      # reachable, the copilot, the decision agents, and those warehouse
      # cross-checks all fall back to their own rule-based text/no-op, same
      # as before this integration existed.
      #
      # COUCHBASE_AOM_URL defaults to host.docker.internal, since AOM runs
      # as its own separate docker-compose stack on the same machine (not
      # joined to this one's network) -- Docker Desktop resolves that
      # hostname to the host machine automatically on macOS/Windows. If
      # you're running AOM elsewhere (a shared network, a remote host),
      # override it.
      #
      # https:// because AOM's operations-manager service serves HTTPS by
      # default (a self-signed cert it generates on first boot -- see the
      # AOM project's docker-compose.yml). aomClient.js trusts that
      # specific cert for AOM calls only (not a global Node TLS setting);
      # see COUCHBASE_AOM_ALLOW_INSECURE_TLS below if that ever needs to
      # change. If you run AOM with DISABLE_TLS=true instead, override this
      # back to http://.
      #
      # COUCHBASE_AOM_API_KEY defaults to AOM's own bundled demo
      # finance_analyst key (see that project's .env.example) -- the
      # least-privilege seeded role that can still call the Snowflake
      # tools (query/get_metrics/list_tables) this app's warehouse
      # cross-checks use, and a much better persona fit than admin for a
      # buyer-facing procurement app. For anything beyond local dev/demo,
      # register a dedicated role for this app in AOM's rbac_policy.py and
      # override this with that role's key instead.
      COUCHBASE_AOM_URL: ${COUCHBASE_AOM_URL:-https://host.docker.internal:8090}
      COUCHBASE_AOM_API_KEY: ${COUCHBASE_AOM_API_KEY:-demo-finance-analyst-7e83}
      COUCHBASE_AOM_PROVIDER: ${COUCHBASE_AOM_PROVIDER:-google}
      COUCHBASE_AOM_MODEL: ${COUCHBASE_AOM_MODEL:-gemini-2.5-flash}
      # Set to "false" if AOM is ever deployed behind a real CA-signed
      # certificate instead of its default self-signed one -- see
      # aomClient.js. Defaults to trusting AOM's self-signed cert.
      COUCHBASE_AOM_ALLOW_INSECURE_TLS: ${COUCHBASE_AOM_ALLOW_INSECURE_TLS:-true}
      # Local login (see README / .env.example): encrypts local password
      # hashes at rest. ENCRYPTION_KEY has no
      # baked-in compose default (unlike COUCHBASE_PASSWORD above) --
      # leaving it unset falls back to auth/crypto.js's own hardcoded dev
      # key with a loud startup warning, rather than this file silently
      # committing a "real" secret to source control.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    container_name: couchbase-pcc-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      # The image still COPYs these in (see frontend/Dockerfile), so it stays
      # self-contained and deployable on its own. These bind mounts just
      # overlay the same paths at run time with the working tree, so editing
      # frontend/public/{index.html,styles.css,app.js} shows up on a browser
      # refresh -- no `--build`, no container restart. Read-only: nginx never
      # writes here, and :ro means a container can't scribble on your source.
      - ./frontend/public:/usr/share/nginx/html:ro
      # Mounted too so nginx.conf edits need only `docker compose restart
      # frontend` rather than a rebuild. nginx reads this once at startup,
      # so a restart (not just a refresh) is required for changes here.
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # Purely informational -- nothing depends_on this being healthy, on
      # purpose. Gating another service behind a healthcheck is what made
      # the couchbase boot above so fragile (see that long note): compose
      # aborts the whole `up` when a health-gated dependency gives up.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  couchbase-data:
