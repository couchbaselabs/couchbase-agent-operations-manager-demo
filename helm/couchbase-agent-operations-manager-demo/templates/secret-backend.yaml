{{- $secretName := printf "%s-backend" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName | default dict -}}
{{- $existingData := get $existing "data" | default dict -}}
{{- $encKey := .Values.backend.encryptionKey -}}
{{- if not $encKey -}}
  {{- $existingKey := get $existingData "ENCRYPTION_KEY" -}}
  {{- if $existingKey -}}
    {{- $encKey = $existingKey | b64dec -}}
  {{- else -}}
    {{- $encKey = randAlphaNum 48 -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "pcc.componentLabels" (merge (dict "component" "backend") .) | nindent 4 }}
type: Opaque
stringData:
  ENCRYPTION_KEY: {{ $encKey | quote }}
  COUCHBASE_AOM_API_KEY: {{ .Values.backend.aom.apiKey | quote }}
