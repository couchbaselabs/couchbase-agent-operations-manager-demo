{{- $secretName := printf "%s-backend" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName | default dict -}}
{{- $existingData := get $existing "data" | default dict -}}
{{- $encKey := .Values.backend.encryptionKey -}}
{{- if not $encKey -}}
  {{- $existingKey := get $existingData "ENCRYPTION_KEY" -}}
  {{- if $existingKey -}}
    {{- $encKey = $existingKey | b64dec -}}
  {{- else -}}
    {{- /* ENCRYPTION_KEY must be 64 hex chars (32 bytes) -- see backend/src/services/crypto.js.
           randAlphaNum can emit non-hex letters (g-z, G-Z), which Buffer.from(str, "hex")
           silently truncates at, so it must never be used directly for this value.
           sha256sum's hex digest is always exactly 64 lowercase hex chars. */ -}}
    {{- $encKey = randAlphaNum 40 | sha256sum -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "pcc.componentLabels" (merge (dict "component" "backend") .) | nindent 4 }}
type: Opaque
stringData:
  ENCRYPTION_KEY: {{ $encKey | quote }}
  COUCHBASE_AOM_API_KEY: {{ .Values.backend.aom.apiKey | quote }}
