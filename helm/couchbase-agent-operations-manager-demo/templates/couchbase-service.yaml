apiVersion: v1
kind: Service
metadata:
  # Literal "couchbase" hostname - the backend connects to
  # http://couchbase:8091 / :8093 exactly like docker-compose.yml's
  # container_name-based DNS did, so this Service must keep this name.
  name: couchbase
  labels:
    {{- include "pcc.componentLabels" (merge (dict "component" "couchbase") .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "pcc.componentSelectorLabels" (merge (dict "component" "couchbase") .) | nindent 4 }}
  ports:
    - name: mgmt
      port: 8091
      targetPort: mgmt
    - name: query
      port: 8093
      targetPort: query
